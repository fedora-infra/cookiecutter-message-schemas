version = 1
SPDX-PackageName = "{{ cookiecutter.slug }}-messages"
SPDX-PackageSupplier = "Fedora Infrastructure <admin@fedoraproject.org>"
SPDX-PackageDownloadLocation = "{{ cookiecutter.url }}-messages"

[[annotations]]
path = ["**.yaml", "**.md", "**.toml", ".gitignore", "**.ini", ".github/**", "docs/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "{{ cookiecutter.year }} Contributors to the Fedora Project"
SPDX-License-Identifier = "LGPL-3.0-or-later"

[[annotations]]
path = "poetry.lock"
precedence = "aggregate"
SPDX-FileCopyrightText = "None, autogenerated"
SPDX-License-Identifier = "LGPL-3.0-or-later"
